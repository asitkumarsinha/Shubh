<audio #tune class="demo-audio" preload="none" [attr.src]="musicUrl || null" loop></audio>

<div class="public-cta">
  @if (demoOnly) {
    <button type="button" class="demo-launch" (click)="openDemo()">{{ 'cta.demo' | t }}</button>
  } @else {
    <div class="cta-row">
      <button type="button" class="btn primary" (click)="openDemo()" title="Play the website demo">{{ 'cta.demo' | t }}</button>
      <a routerLink="/register" class="btn ghost">{{ 'cta.feedback' | t }}</a>
    </div>
  }
</div>

@if (playDemo) {
  <div class="demo-backdrop" (click)="closeDemo()">
    <div class="demo-player" (click)="$event.stopPropagation()">
      <button type="button" class="demo-close" (click)="closeDemo()" aria-label="Close">×</button>
      <iframe class="demo-frame" src="/demo" title="Demo"></iframe>
    </div>
  </div>
}
