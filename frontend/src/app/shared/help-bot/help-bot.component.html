@if (!hidden) {
  <div class="help-bot">
    @if (open) {
      <section class="panel" role="dialog" aria-label="My Stores Hubs help">
        <header>
          <strong>Help</strong>
          <button type="button" (click)="open = false" aria-label="Close chat">×</button>
        </header>
        <div class="log">
          @for (line of lines; track $index) {
            <p [class.user]="line.from === 'user'">
              {{ line.text }}
              @if (line.links?.length) {
                <span class="links">
                  @for (link of line.links; track link.path) {
                    <a [routerLink]="link.path" (click)="open = false">{{ link.label }}</a>
                  }
                </span>
              }
            </p>
          }
        </div>
        <form (ngSubmit)="ask($event)">
          <label class="sr-only" for="help-bot-ask">Ask about My Stores Hubs</label>
          <input id="help-bot-ask" name="ask" [(ngModel)]="draft" placeholder="Ask about My Stores Hubs" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </section>
    }
    <div class="launcher">
      <button type="button" class="hide" (click)="hide()" aria-label="Hide help bot">×</button>
      <button type="button" class="bubble" (click)="toggle()" [attr.aria-expanded]="open" aria-label="Open help bot">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <rect x="4" y="6" width="16" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.7" />
          <circle cx="9" cy="12" r="1" fill="currentColor" />
          <circle cx="12" cy="12" r="1" fill="currentColor" />
          <circle cx="15" cy="12" r="1" fill="currentColor" />
          <path d="M8 18.5 6 21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>
}
