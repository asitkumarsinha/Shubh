<div class="lang-switcher" [class.light]="variant === 'light'" [class.dark]="variant === 'dark'">
  <button
    type="button"
    class="lang-chip"
    (click)="toggle()"
    [attr.aria-expanded]="open"
    aria-haspopup="listbox"
    [attr.aria-label]="'Language: ' + i18n.current().native"
  >
    <svg class="chip-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
      <path
        d="M3 12h18M12 3c2.5 2.6 3.8 6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-6-3.8-9s1.3-6.4 3.8-9Z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
      />
    </svg>
    <span class="chip-label">{{ i18n.current().native }}</span>
    <svg class="chevron" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
      <path
        d="M5 8.5 12 15l7-6.5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  @if (open) {
    <ul class="lang-menu" role="listbox">
      @for (option of i18n.languages; track option.code) {
        <li role="option" [attr.aria-selected]="option.code === i18n.lang()">
          <button
            type="button"
            class="lang-option"
            [class.active]="option.code === i18n.lang()"
            (click)="select(option.code)"
          >
            <span class="native">{{ option.native }}</span>
            <span class="label">{{ option.label }}</span>
          </button>
        </li>
      }
    </ul>
  }
</div>
