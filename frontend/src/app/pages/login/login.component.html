<section class="auth-page">
  <div class="auth-visual" aria-hidden="true">
    <div class="orb"></div>
    <h1>MediShop</h1>
    <p>Trusted online pharmacy — browse, cart, checkout, and track approvals.</p>
  </div>

  <form class="auth-card" (ngSubmit)="submit()">
    <h2>Sign in</h2>
    <p class="muted">Login as admin or customer</p>

    <label>
      Email
      <input type="email" [(ngModel)]="email" name="email" required autocomplete="username" />
    </label>
    <label>
      Password
      <input type="password" [(ngModel)]="password" name="password" required autocomplete="current-password" />
    </label>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <button type="submit" class="btn primary" [disabled]="loading">
      {{ loading ? 'Signing in…' : 'Sign in' }}
    </button>

    <div class="demo-row">
      <button type="button" class="btn ghost" (click)="fillDemo('admin')">Admin demo</button>
      <button type="button" class="btn ghost" (click)="fillDemo('user')">User demo</button>
    </div>

    <p class="footer-text">
      New customer?
      <a routerLink="/register">Create an account</a>
    </p>
  </form>
</section>
