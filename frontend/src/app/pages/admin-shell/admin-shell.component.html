<section class="desk-screen">
  <div class="desk-shell">
      <header class="desk-topbar">
      <div class="topbar-brand">
        <img class="brand-mark" [src]="settings.current().logo" [alt]="settings.current().title" />
        <app-language-switcher variant="light" />
      </div>

      <div class="topbar-actions">
        <a routerLink="/shoppingmall" class="action-chip highlight">
          <span class="icon-circle bag">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M7 9V7a5 5 0 0 1 10 0v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <rect x="4.5" y="9" width="15" height="11" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6" />
            </svg>
          </span>
          <span class="chip-label">{{ 'mall.shoppingMall' | t }}</span>
        </a>
        <span class="chip-divider" aria-hidden="true"></span>
        <button type="button" class="action-chip" (click)="logout()">
          <span class="icon-circle">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <circle cx="12" cy="8.5" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path d="M5 19c1.2-3.4 4-5.2 7-5.2s5.8 1.8 7 5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </span>
          <span class="chip-label">{{ auth.user()?.name }} - {{ auth.categoryKey() | t }}</span>
        </button>
      </div>
    </header>

    <div class="desk-body" [class.collapsed]="!pinned">
      <aside class="desk-nav">
        <button
          type="button"
          class="pin"
          [class.pinned]="pinned"
          [attr.aria-pressed]="pinned"
          [attr.aria-label]="'account.pinMenu' | t"
          (click)="togglePin()"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M9 4.5h6l-1 5.5 2.5 2.5v1.5H7.5V12.5L10 10 9 4.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M12 14v6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
        <img class="menu-logo" [src]="settings.current().logo" [alt]="settings.current().title" />
        @for (section of sections; track $index) {
          @if (section.title) {
            <p class="nav-label">{{ section.title | t }}</p>
          }
          @for (link of section.links; track link.label) {
            <a
              [routerLink]="link.disabled ? null : link.path"
              routerLinkActive="active"
              class="nav-link"
              [class.disabled]="link.disabled"
              [attr.aria-disabled]="link.disabled ? 'true' : null"
              [attr.tabindex]="link.disabled ? -1 : null"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                @switch (link.icon) {
                  @case ('plus') {
                    <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                  }
                  @case ('search') {
                    <circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.6" />
                    <path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                  }
                  @case ('box') {
                    <path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5v-7Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                    <path d="M12 12 20 8.5M12 12v8M12 12 4 8.5" fill="none" stroke="currentColor" stroke-width="1.5" />
                  }
                  @case ('star') {
                    <path d="m12 4 2.1 4.4 4.8.7-3.5 3.4.8 4.8L12 15.8 7.8 17.3l.8-4.8L5.1 9.1l4.8-.7L12 4Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                  }
                  @case ('user-plus') {
                    <circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5" />
                    <path d="M3.5 18c.8-2.6 2.8-4 5.5-4s4.7 1.4 5.5 4M17 8v6M14 11h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                  }
                  @case ('user') {
                    <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5" />
                    <path d="M5.5 19c1-3 3.4-4.6 6.5-4.6s5.5 1.6 6.5 4.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                  }
                  @case ('medal') {
                    <circle cx="12" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="1.5" />
                    <path d="m9 12.5-1.2 7L12 17l4.2 2.5L15 12.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                  }
                  @case ('alert') {
                    <path d="M12 4 3.5 19h17L12 4Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                    <path d="M12 10v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                    <circle cx="12" cy="16.2" r="0.8" fill="currentColor" />
                  }
                  @case ('card') {
                    <rect x="3.5" y="6" width="17" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" />
                    <path d="M3.5 10h17" fill="none" stroke="currentColor" stroke-width="1.5" />
                  }
                  @case ('copy') {
                    <rect x="8" y="8" width="11" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" />
                    <path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4H6.5A1.5 1.5 0 0 0 5 5.5v10A1.5 1.5 0 0 0 6.5 17H8" fill="none" stroke="currentColor" stroke-width="1.5" />
                  }
                }
              </svg>
              <span>{{ link.label | t }}</span>
            </a>
          }
        }
      </aside>

      <div class="desk-content">
        <router-outlet />
      </div>
    </div>

    <footer class="desk-footer">
      {{ 'login.footer' | t: { title: settings.current().title } }}
    </footer>
  </div>
</section>
