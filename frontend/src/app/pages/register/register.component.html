<section class="auth-page">
  <div class="auth-visual" aria-hidden="true">
    <div class="orb">
      <img class="auth-logo" src="assets/shubh-surgical-logo.svg" alt="" width="88" height="88" />
    </div>
    <h1>{{ 'register.visualTitle' | t }}</h1>
    <p class="slogan">{{ 'register.visualSlogan' | t }}</p>
    <p>{{ 'register.visualDesc' | t }}</p>
  </div>

  <form class="auth-card" (ngSubmit)="submit()">
    <h2>{{ 'register.title' | t }}</h2>
    <p class="muted">{{ 'register.subtitle' | t }}</p>

    <label>{{ 'register.fullName' | t }}
      <input [(ngModel)]="name" name="name" required />
    </label>
    <label>{{ 'register.email' | t }}
      <input type="email" [(ngModel)]="email" name="email" required />
    </label>
    <label>{{ 'register.password' | t }}
      <input type="password" [(ngModel)]="password" name="password" required minlength="6" />
    </label>
    <label>{{ 'register.phone' | t }}
      <input [(ngModel)]="phone" name="phone" />
    </label>
    <label>{{ 'register.address' | t }}
      <textarea [(ngModel)]="address" name="address" rows="2"></textarea>
    </label>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <button type="submit" class="btn primary" [disabled]="loading">
      {{ loading ? ('register.creating' | t) : ('register.submit' | t) }}
    </button>

    <p class="footer-text">
      {{ 'register.haveAccount' | t }}
      <a routerLink="/login">{{ 'register.signIn' | t }}</a>
    </p>
  </form>
</section>
