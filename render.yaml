services:
  - type: web
    name: shubh-surgical
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend && npm rebuild better-sqlite3 --prefix backend && npm install --prefix frontend && npm run build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_SERVICE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
